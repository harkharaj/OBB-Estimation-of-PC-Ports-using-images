<!DOCTYPE html>
<html>
<head>
    <title>Interactive OBB Annotator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; display: flex; gap: 20px; }
        .sidebar { width: 300px; padding: 15px; background: #f4f4f4; border-radius: 8px; }
        .main { flex-grow: 1; }
        #canvas-container { position: relative; display: inline-block; cursor: crosshair; }
        #target-image { max-width: 100%; border: 1px solid #ccc; display: none;}
        .point-marker {
            position: absolute; width: 10px; height: 10px; background: red;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        input, select, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        #result-json { background: #222; color: #0f0; padding: 10px; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
        .obs-list { font-size: 12px; color: #555; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>1. Entity Details</h3>
    <input type="text" id="entity-name" placeholder="Entity Name (e.g. power_socket)">
    <label>Half-Extents (Meters):</label>
    <input type="number" id="extent-w" placeholder="Width (W)" step="0.001">
    <input type="number" id="extent-h" placeholder="Height (H)" step="0.001">
    <input type="number" id="extent-l" placeholder="Length (L)" step="0.001">

    <h3>2. Add Observations</h3>
    <select id="image-select">
        <option value="">-- Select an Image --</option>
        {% for img in images %}
            <option value="{{ img }}">{{ img }}</option>
        {% endfor %}
    </select>
    
    <div class="obs-list" id="obs-list">
        <p>No observations yet. Select an image and click on the port.</p>
    </div>

    <h3>3. Compute</h3>
    <button onclick="computeOBB()">Compute OBB</button>

    <h3>Result JSON:</h3>
    <pre id="result-json"></pre>
</div>

<div class="main">
    <div id="canvas-container">
        <img id="target-image" src="" alt="Target Frame">
    </div>
</div>

<script>
    let observations = [];
    const imageSelect = document.getElementById('image-select');
    const targetImage = document.getElementById('target-image');
    const container = document.getElementById('canvas-container');

    // Handle image selection
    imageSelect.addEventListener('change', function() {
        // Clear old markers
        document.querySelectorAll('.point-marker').forEach(e => e.remove());
        
        if(this.value) {
            targetImage.src = "/image/" + this.value;
            targetImage.style.display = "block";
        } else {
            targetImage.style.display = "none";
        }
    });

    // Handle clicking on the image
    targetImage.addEventListener('click', function(e) {
        if(!imageSelect.value) return;

        // Calculate the actual image pixel coordinate based on scaling
        const rect = targetImage.getBoundingClientRect();
        const scaleX = targetImage.naturalWidth / rect.width;
        const scaleY = targetImage.naturalHeight / rect.height;
        
        const pixelX = Math.round((e.clientX - rect.left) * scaleX);
        const pixelY = Math.round((e.clientY - rect.top) * scaleY);

        // Save the observation
        observations.push({
            image: imageSelect.value,
            x: pixelX,
            y: pixelY
        });

        updateObservationList();

        // Draw a visual red dot where they clicked
        const marker = document.createElement('div');
        marker.className = 'point-marker';
        marker.style.left = (e.clientX - rect.left) + 'px';
        marker.style.top = (e.clientY - rect.top) + 'px';
        container.appendChild(marker);
    });

    function updateObservationList() {
        const listDiv = document.getElementById('obs-list');
        listDiv.innerHTML = '<strong>Logged Points:</strong><br>';
        observations.forEach((obs, index) => {
            listDiv.innerHTML += `${index + 1}. ${obs.image} -> (${obs.x}, ${obs.y})<br>`;
        });
    }

    function computeOBB() {
        const payload = {
            entity_name: document.getElementById('entity-name').value || "unknown",
            extent: [
                parseFloat(document.getElementById('extent-w').value || 0),
                parseFloat(document.getElementById('extent-h').value || 0),
                parseFloat(document.getElementById('extent-l').value || 0)
            ],
            observations: observations
        };

        fetch('/compute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if(data.error) {
                alert(data.error);
            } else {
                document.getElementById('result-json').textContent = JSON.stringify(data, null, 2);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("An error occurred. Check the terminal.");
        });
    }
</script>
</body>
</html>
